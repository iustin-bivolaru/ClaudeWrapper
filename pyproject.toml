[project]
name = "remi"
version = "0.1.0"
description = "Cost-aware, security-hardened Claude Code setup: orchestrator, workers, reviewer, guards and quality gate."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["main.py"]  # PyCharm sample file

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "D"]
ignore = ["S603", "S602", "S607", "S108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"plugin/hooks/scripts/*" = ["E501"]  # regex tables

[tool.pytest.ini_options]
testpaths = ["tests"]
